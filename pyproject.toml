[project]
name = "cortexa"
version = "0.1.0"
description = "Cortexa - bionic AI memory system for the Agent Memory Leaderboard challenge"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cortexa Team" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "openai>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortexa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_archive", ".novel_probe_root", ".backups"]

[tool.ruff.lint]
# 闸门收敛到真错误/死代码类（E4/E7/E9=Fatal、F=pyflakes、I=import 排序）；
# 风格大类（B/SIM/UP/RUF 全角标点）与中文注释工作语言冲突，留作未来非阻塞饮食。
select = ["E4", "E7", "E9", "F", "I"]